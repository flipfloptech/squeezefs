# Unstructured-input fuzzing for SqueezeFS's three untrusted-input
# surfaces (docs/pre-rc-engineering-spec.md §11 TEST-4):
#
#   1. on-disk metadata — a mount parses whatever the device holds, and
#      the crash contract's whole point is that torn/garbage bytes are
#      *detected*, never branched on;
#   2. the remote job-wire — every byte before enrollment is
#      attacker-chosen (the listener defaults to 0.0.0.0);
#   3. the IPC shared memfd + bootstrap blob — the shim reads a blob and
#      a header written by a process it must not trust unconditionally.
#
# 1.2 added to surfaces 1 and 2: the kvmap block-map tree's codecs
# (incompat bit 16), and the cluster wire's RPC vocabulary +
# authenticated framing with the S8/S9 verb bodies that ride it
# (`cluster_wire_frame`, `publish_wire`) — the bytes one MEMBER of a
# multi-writer set hands the volume authority. The symmetric-metadata
# forest (incompat bit 17, PR 1) folded the kvmap target into
# `slot_tree_record` — the ONE forest key codec every record of a forest
# volume passes through, plus the block-map codecs verbatim — and added
# `slot_state_record` for tree 0's slot-root records.
#
# `tests/ipc_host_tests.rs` and `tests/job_wire_bounds_tests.rs` cover
# every NAMED refusal class well. What these targets add is the classes
# nobody thought of. `tests/decoder_property_tests.rs` is the per-commit
# proptest mirror of the same laws.
#
# Own workspace (like loom-models): the fuzz profile carries sanitizer
# and coverage RUSTFLAGS that must not poison the main build graph.
[package]
name = "squeezefs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

# Load-bearing: as its own workspace root this crate does NOT inherit the
# root manifest's patch table, and the root crate's prepublish-style
# `fuse3 = "1.1"` requirement can only be satisfied by the in-tree
# first-party fork (crates.io fuse3 is 0.7.x and structurally different).
[patch.crates-io]
fuse3 = { path = "../crates/fuse3" }

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
bytes = "1.5"

[dependencies.squeezefs]
path = ".."

[dependencies.squeezefs-ipc]
path = "../crates/squeezefs-ipc"

# Keep the fuzz binaries debuggable: a crash report that cannot be
# symbolicated costs more than the build time it saves.
[profile.release]
debug = true

