[package]
name = "squeezefs"
version = "0.1.0"
edition = "2021"

[dependencies]
parking_lot = "0.12"
memmap2 = "0.9"
bincode = "1.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
aws-sdk-s3 = "1.42.0"
aws-config = "1.5.5"
aws-smithy-runtime = "1.6.4"
tokio = { version = "1.36", features = ["full"] }
fuse3 = { version = "0.7", features = ["tokio-runtime", "unprivileged", "file-lock"] }
io-uring = "0.6"
redis = { version = "0.24", features = ["tokio-comp", "cluster-async", "connection-manager", "sentinel", "script", "aio"] }
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
thiserror = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
async-trait = "0.1"
once_cell = "1.19"
uuid = { version = "1.7", features = ["v4"] }
clap = { version = "4.4", features = ["derive", "env"] }
indicatif = "0.17"
colored = "2.1"
libloading = { version = "0.8", optional = true }
hyper-014 = { package = "hyper", version = "0.14", features = ["full"] }
hyper-rustls-024 = { package = "hyper-rustls", version = "0.24", features = ["webpki-roots", "tokio-runtime", "http1", "http2"] }
moka = { version = "0.12.15", features = ["sync"] }
fastrand = "2.0"
core_affinity = "0.8"
socket2 = "0.5"
dhat = { version = "0.3.3", optional = true }
coz = { version = "0.1", optional = true }
lz4_flex = "0.11"
zstd = "0.13"
rsa = { version = "0.9", features = ["pem"] }
ring = "0.17"
rand = "0.8"
sha2 = "0.10"
ahash = "0.8"
twox-hash = "1.6"
bytes = { version = "1.5", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crossbeam = "0.8"
scc = "3.8.3"

[features]
default = []
gds = ["dep:libloading"]
dhat-on = ["dep:dhat"]
coz-on = ["dep:coz"]

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
nix = { version = "0.29.0", features = ["ioctl"] }

[[bench]]
name = "squeezefs_bench"
harness = false

[[bench]]
name = "high_concurrency_bench"
harness = false

[patch.crates-io]
fuse3 = { path = "third_party/fuse3" }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.5"

[profile.release]
debug = true
