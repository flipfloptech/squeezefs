[package]
name = "squeezefs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
fuse3 = { version = "0.7", features = ["tokio-runtime", "unprivileged", "file-lock"] }
io-uring = "0.6"
redis = { version = "0.24", features = ["tokio-comp", "cluster-async", "connection-manager", "sentinel"] }
aws-config = "1.1"
aws-sdk-s3 = "1.17"
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
thiserror = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
async-trait = "0.1"
once_cell = "1.19"
uuid = { version = "1.7", features = ["v4"] }
clap = { version = "4.4", features = ["derive", "env"] }
indicatif = "0.17"
colored = "2.1"
libloading = { version = "0.8", optional = true }
hyper-014 = { package = "hyper", version = "0.14", features = ["full"] }
hyper-rustls-024 = { package = "hyper-rustls", version = "0.24", features = ["webpki-roots", "tokio-runtime", "http1", "http2"] }
aws-smithy-runtime = "1.1"
moka = { version = "0.12.15", features = ["sync"] }
fastrand = "2.0"

[features]
default = []
gds = ["dep:libloading"]

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"

[[bench]]
name = "squeezefs_bench"
harness = false

[patch.crates-io]
fuse3 = { path = "third_party/fuse3" }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.5"

