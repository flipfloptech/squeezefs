# squeezefs-preload — the L4 LD_PRELOAD interception shim
# (docs/design-preload-interception.md §5.4, PR L4-5).
#
# Output: `libsqueezefs_il.so`. Dependencies: `libc` + `squeezefs-ipc`
# ONLY — no tokio, no allocator replacement (§5.4: we never interpose
# allocation for the host app; the daemon's jemalloc is a Rust
# #[global_allocator], a property this crate keeps).
#
# BUILD DISCIPLINE (§5.4 Issue-4): the ONLY sanctioned build of the
# shipped .so is
#
#     cargo build -p squeezefs-preload --profile preload-release
#
# (root profile `release` carries panic="abort", which would void the
# interposers' catch_unwind and turn any shim panic into a host-app
# abort; src/lib.rs carries the #[cfg(panic = "abort")] compile_error!
# guard making a wrong-profile build unrepresentable). The crate is
# deliberately OUTSIDE the workspace default-members so plain root
# `--release` invocations never build it; `tests/run_preload_gate.sh`
# is its gate.

[package]
name = "squeezefs-preload"
# First-party crate: tracks the SqueezeFS release-train version
# (docs/operations.md §Versioning & releases), bumped as a release act.
# Git commits remain the fine-grained identity.
version = "1.2.2"
edition = "2021"
license-file = "../../LICENSE"
publish = false

[lib]
name = "squeezefs_il"
# cdylib = the shipped interposer .so; rlib = what the crate's own test
# suite (and only it) links — never shipped into host apps.
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
squeezefs-ipc = { path = "../squeezefs-ipc" }

[dev-dependencies]
# The crate's own integration tests speak the wire types directly
# (refusal-class reason formatting) and use libc errno constants.
libc = "0.2"
squeezefs-ipc = { path = "../squeezefs-ipc" }
# PERF-7 microbench (offset-mirror bookkeeping vs the replaced lseek
# syscall pair). Dev-only; never in the shipped cdylib's dependency
# closure.
criterion = "0.5"

# PERF-7: the offset-mirror bookkeeping vs the lseek64 syscall pair it
# replaced (docs/pre-rc-engineering-spec.md §9). The Issue-4 profile
# discipline applies to benches exactly as to everything else — the
# sanctioned invocation is
#
#     cargo bench -p squeezefs-preload --profile preload-release \
#         --bench offset_mirror_bench
#
# (a plain `cargo bench` inherits the root release profile's
# panic="abort" into the lib build and the compile_error! guard
# refuses it, by design).
[[bench]]
name = "offset_mirror_bench"
harness = false

[features]
# The #[no_mangle] libc interposer symbols. ONLY the shipped cdylib
# enables this: an rlib carrying strong `open`/`read`/`write`/`close`
# symbols would interpose INSIDE any test binary that links it (the
# binary's own symbols beat libc's dynamic ones). The sanctioned .so
# build is therefore:
#
#     cargo build -p squeezefs-preload --profile preload-release \
#         --features interposers
#
# (tests/run_preload_gate.sh); the root dev-dependency stays
# feature-less and links only the cores + session client.
interposers = []

[lints.rust]
# The loom-models crate `#[path]`-includes `fd_table_core.rs` under
# `--cfg loom` (spec §11 TEST-5); the main build never sets it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
