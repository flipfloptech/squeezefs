name = "meta_lv_bench"
harness = false

[[bench]]
name = "high_concurrency_bench"
harness = false

[[bench]]
name = "squeezefs_bench"
harness = false

[[bench]]
name = "ipc_hop_bench"
harness = false

# The microbench program (2026-08-04,
# .benchmarks/2026-08-04-microbench-program.md): hot-path Criterion
# groups + the baseline-comparison harness (tests/run_bench_baseline.sh).
[[bench]]
name = "copy_path_bench"
harness = false

[[bench]]
name = "zcrx_bench"
harness = false

[[bench]]
name = "read_path_bench"
harness = false

[[bench]]
name = "write_path_bench"
harness = false

[[bench]]
name = "nvme_issue_bench"
harness = false

# DLM S6: the membership plane's renewal path and read-side enumeration.
# WRITTEN, NOT RUN per ruling D11 — every group states its field shape, a
# prediction and a falsification criterion in-file.
[[bench]]
name = "membership_bench"
harness = false


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
