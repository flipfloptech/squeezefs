; io500 SCOPING configuration for the bracket harness (derived from the
; distribution's config-minimal.ini). The venue is a VM with a ≤ 10 GiB
; scratch bound, so every phase is capped — this is NOT a submittable run:
; stonewall 60 s (the measurement law's sustained floor) instead of 300 s,
; per-process ior sizes capped so four ranks write ≤ ~6 GiB, mdtest item
; counts capped. The acceptance box runs the distribution's
; config-minimal.ini unmodified (docs/gates/brackets.md).
[global]
datadir = ./datafiles
timestamp-datadir = FALSE
timestamp-resultdir = TRUE

[debug]
stonewall-time = 60

[ior-easy]
; 1 GiB per rank at 2 MiB transfers (the default transferSize); 4 ranks → 4 GiB.
blockSize = 1g

[ior-hard]
; 47008 B segments; 10 000 per rank → ≈ 0.44 GiB per rank.
segmentCount = 10000

[mdtest-easy]
n = 200000

[mdtest-hard]
n = 50000

[find]
nproc = 4
