# squeezefs-ipc — the L4 interception IPC protocol crate
# (docs/design-preload-interception.md §5.3, PR L4-1).
#
# Dependency-free ON PURPOSE: the protocol cores (`ring_core`, `slot_core`,
# plus the `#[path]`-shared fuse3 `wake_core`) are `#[path]`-included by
# `loom-models` (the house convention — models check the shipped code, not
# a copy), and the future `squeezefs-preload` cdylib links this crate into
# arbitrary host applications (no tokio, no allocator replacement — §5.4).

[package]
name = "squeezefs-ipc"
# First-party crate: tracks the SqueezeFS release-train version
# (docs/operations.md §Versioning & releases), bumped as a release act.
# Git commits remain the fine-grained identity.
version = "1.2.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

[dependencies]
# The LIBRARY is dependency-free — see the crate-level rationale above.
# Everything below is `rig`-feature-only plumbing for the PR L4-2 two-
# process IPC-hop rig binary (the G-L4-1 go/no-go spike); the library
# surface and the loom-included cores never see these.
libc = { version = "0.2", optional = true }
scc = { version = "3.8.3", optional = true }
tokio = { version = "1.36", default-features = false, features = [
    "rt-multi-thread",
], optional = true }

[features]
rig = ["dep:libc", "dep:scc", "dep:tokio"]

[[bin]]
name = "ipc_hop_rig"
required-features = ["rig"]

[dev-dependencies]
proptest = "1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
