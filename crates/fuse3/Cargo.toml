#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

# Excluded from the root workspace (root Cargo.toml `workspace.exclude`);
# this empty table makes the crate its own workspace root so `cargo test`
# runs here standalone — the loom-models precedent (own workspace, own
# lock). Without it, cargo refuses with "believes it's in a workspace
# when it's not" (broken since the L4-1 root-workspace introduction;
# surfaced by the L4-6 gate, the first to run this suite since).
[workspace]

[package]
edition = "2021"
rust-version = "1.77"
name = "fuse3"
# Fully-diverged first-party fork (forked from upstream fuse3 0.7.3 — see
# THIRD_PARTY_NOTICES.md): carries the SqueezeFS release-train version
# (docs/operations.md §Versioning & releases), bumped as a release act.
version = "1.2.0"
authors = ["Sherlock Holo <sherlockya@gmail.com>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "FUSE user-space library async version implementation."
readme = "README.md"
keywords = [
    "fuse",
    "filesystem",
    "system",
    "bindings",
]
categories = [
    "api-bindings",
    "filesystem",
]
license = "MIT"
repository = "https://github.com/Sherlock-Holo/fuse3"

[package.metadata.docs.rs]
features = [
    "file-lock",
    "unprivileged",
    "tokio-runtime",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
targets = [
    "i686-unknown-freebsd",
    "i686-unknown-linux-gnu",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-linux-gnu",
]

[lib]
name = "fuse3"
path = "src/lib.rs"

[dependencies.async-notify]
version = "0.3"

[dependencies.bincode]
version = "1.3.3"

[dependencies.bytes]
version = "1.5"

[dependencies.futures-channel]
version = "0.3.30"
features = ["sink"]

[dependencies.futures-util]
version = "0.3.30"
features = ["sink"]

[dependencies.libc]
version = "0.2.155"

[dependencies.nix]
version = "0.29.0"
features = [
    "fs",
    "mount",
    "ioctl",
]
default-features = false

[dependencies.serde]
version = "1.0.196"
features = ["derive"]

[dependencies.slab]
version = "0.4.9"

[dependencies.tracing]
version = "0.1.40"
# The daemon logs through `log`/env_logger and installs no tracing
# subscriber, so without this feature every transport warn!/error! —
# including the zc opcode-mirror guards, whose whole design is
# "loud-never-corrupt" — was structurally INVISIBLE in the daemon log
# (the 2026-08-06 out-paged-mirror divergence EIO'd every readdir with
# zero log lines anywhere). With `log`, tracing events emit `log`
# records when no subscriber is set; env_logger's level filter keeps
# debug!/trace! hot-path macros short-circuited as before.
features = ["log"]

[dependencies.trait-make]
version = "0.1"

[dependencies.which]
version = "6"
optional = true

[dependencies.io-uring]
version = "0.6"

[dependencies.once_cell]
version = "1.19"

[dependencies.core_affinity]
version = "0.8"

# TESTS ONLY (rip-tokio-total): the product carries zero tokio — timers,
# channels, locks, fd readiness, blocking offload and task venues are all
# first-party sqz_* primitives. The async test harness (#[tokio::test],
# multi_thread flavor per house rule) is the sole remaining consumer.
[dev-dependencies.tokio]
version = "1.36"
features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
]

# The #[path]-included sqz_sync test module (canonical file in the root
# crate) drives poll-cancellation shapes through `futures::pin_mut` /
# `noop_waker` — tests only.
[dev-dependencies.futures]
version = "0.3.30"

[features]
# tokio-runtime is a DEPRECATED NO-OP since the rip-tokio-total program
# (2026-08-13): the transport now runs on first-party sqz_* primitives
# and no runtime dependency exists to gate. The feature name is kept —
# empty — because the consuming daemon's dependency declaration names it
# (root Cargo.toml: `features = ["tokio-runtime", "unprivileged"]`) and
# the in-tree `cfg(feature = "tokio-runtime")` gates stay true by
# default. Do not hang new behavior off it.
default = ["tokio-runtime"]
file-lock = []
tokio-runtime = []
unprivileged = [
    "nix/socket",
    "dep:which",
]

[target.'cfg(target_os = "linux")'.dependencies.nix]
version = "0.29.0"
features = ["user", "ioctl"]
default-features = false

# The microbench program (2026-08-04, root
# .benchmarks/2026-08-04-microbench-program.md): transport hot-path
# Criterion groups. `autobenches = false` above, so the target is
# declared explicitly — house style `harness = false`.
[dev-dependencies.criterion]
version = "0.5"

[[bench]]
name = "fuse3_hot_bench"
harness = false

# `lease_core.rs` (FUSE-over-io_uring payload-lease protocol core) is
# `#[path]`-included by the SqueezeFS loom-models crate and switches its
# atomics on `cfg(loom)`; the main build never sets it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
