[package]
name = "squeezefs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
fuse3 = { version = "0.7", features = ["tokio-runtime", "unprivileged"] }
io-uring = "0.6"
redis = { version = "0.24", features = ["tokio-comp", "cluster-async", "connection-manager"] }
aws-config = "1.1"
aws-sdk-s3 = "1.17"
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
thiserror = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
async-trait = "0.1"
once_cell = "1.19"
uuid = { version = "1.7", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "squeezefs_bench"
harness = false
