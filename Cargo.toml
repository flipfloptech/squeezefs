[package]
name = "squeezefs"
# The release-train version (docs/operations.md §Versioning & releases):
# bumped as a release act (user directive 2026-07-24). Git commits remain
# the fine-grained identity; stable-*/lts-* tags remain the release names.
# The first-party crates (crates/fuse3, crates/squeezefs-{ipc,preload})
# track the same train.
version = "1.1.0"
edition = "2021"
license-file = "LICENSE"

# L4 workspace (design-preload-interception §5.4 / KD-8, OQ-2 primary path):
# root + the IPC protocol crate. `crates/squeezefs-preload` joins `members`
# (but NOT `default-members` — the §5.4 panic-profile posture) when PR L4-5
# creates it. Excluded on purpose:
#   - crates/fuse3 — stays a [patch.crates-io] path dep with its own
#     standalone suite (first-party fork precedent); NOT a member, or the
#     root gate would absorb its test surface. The patch indirection is
#     LOAD-BEARING for workspace topology, not crates-io identity: the
#     fork is its own workspace root (the empty [workspace] table in its
#     manifest), and cargo rejects a *direct* path dependency to a nested
#     foreign workspace root ("multiple workspace roots found in the same
#     workspace") even when excluded — patch entries bypass that check
#     (the prepublish precedent). The fork carries the SqueezeFS
#     release-train version (1.1.x, no longer upstream's 0.7.x), so the
#     requirement below is the prepublish-style `version = "1.1"` that
#     only the patched source can satisfy.
#   - loom-models — must stay its own workspace so `--cfg loom` RUSTFLAGS
#     never poison the main dependency graph (see loom-models/Cargo.toml).
[workspace]
members = [".", "crates/squeezefs-ipc", "crates/squeezefs-preload"]
exclude = ["crates/fuse3", "loom-models"]
# squeezefs-preload is deliberately NOT a default member (§5.4 Issue-4):
# plain root `--release` builds carry panic="abort", which its
# compile_error! guard refuses — it builds only under
# `--profile preload-release` via tests/run_preload_gate.sh.
default-members = [".", "crates/squeezefs-ipc"]

[dependencies]
parking_lot = "0.12"
memmap2 = "0.9"
bincode = "1.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
tokio = { version = "1.48", features = ["full"] }
# `file-lock` is deliberately OFF: POSIX byte-range locks are KERNEL-LOCAL
# (FUSE_POSIX_LOCKS is never advertised — fstests generic/131/478/504; see
# the fuse3 negotiation pins). The feature would re-require daemon
# getlk/setlk impls nothing can ever call.
# Resolves ONLY via the [patch.crates-io] path entry below (crates.io has
# no fuse3 1.1 — the fully-diverged first-party fork carries the SqueezeFS
# release train; see the workspace-topology note above).
fuse3 = { version = "1.1", features = ["tokio-runtime", "unprivileged"] }
io-uring = "0.6"
dashmap = "5.5"
zerocopy = { version = "0.8.52", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
thiserror = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
async-trait = "0.1"
once_cell = "1.19"
uuid = { version = "1.7", features = ["v4"] }
clap = { version = "4.4", features = ["derive", "env"] }
indicatif = "0.17"
colored = "2.1"
libloading = { version = "0.8", optional = true }
hyper-014 = { package = "hyper", version = "0.14", features = ["full"] }
hyper-rustls-024 = { package = "hyper-rustls", version = "0.24", features = ["webpki-roots", "tokio-runtime", "http1", "http2"] }
moka = { version = "0.12.15", features = ["sync"] }
fastrand = "2.0"
core_affinity = "0.8"
socket2 = "0.5"
dhat = { version = "0.3.3", optional = true }
coz = { version = "0.1", optional = true }
lz4_flex = "0.11"
zstd = "0.13"
rsa = { version = "0.9", features = ["pem"] }
ring = "0.17"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
# The §5.1.6 job-shard execution wire's TLS (design-volume-lifecycle
# KD-15): framed TCP/TLS, reusing ClusterSecurityConfig's cert/CA/
# verifier machinery — NOT the quinn wrap.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ahash = "0.8"
twox-hash = "1.6"
bytes = { version = "1.5", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crossbeam = "0.8"
scc = "3.8.3"
arc-swap = "1.7"
compact_str = "0.8"
squeezefs-ipc = { path = "crates/squeezefs-ipc" }

[features]
default = []
gds = ["dep:libloading"]
dhat-on = ["dep:dhat"]
coz-on = ["dep:coz"]

[dev-dependencies]
regex = "1.10"
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.5"
rand = "0.8"
rand_chacha = "0.3"
rstest = { version = "0.23", default-features = false }
sha2 = "0.10"
nix = { version = "0.29.0", features = ["ioctl"] }
# The L4-5 shim as an rlib for the root E2E session tests
# (tests/preload_session_tests.rs — real host vs real client library).
# Dev-only: test-profile builds are panic=unwind, so the crate's
# #[cfg(panic = "abort")] guard never trips here; the shipped cdylib
# still builds only via --profile preload-release.
squeezefs-preload = { path = "crates/squeezefs-preload" }

# Load-bearing (see the crates/fuse3 workspace-topology note at the top):
# redirects the prepublish-style `fuse3 = "1.1"` requirement to the
# in-tree first-party fork — cargo rejects the equivalent direct path
# dependency because the fork is its own (excluded) workspace root.
[patch.crates-io]
fuse3 = { path = "crates/fuse3" }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.5"
tikv-jemalloc-sys = "0.5"

[profile.release]
debug = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The ONLY sanctioned build profile for the future `squeezefs-preload`
# cdylib (design-preload-interception §5.4, Issue-4 resolution): the root
# `panic = "abort"` would silently void the shim's `catch_unwind` and turn
# any shim panic into a host-application abort. Verified accepted by the
# pinned toolchain at PR L4-1 (built `squeezefs-ipc` under it as the
# acceptance probe); the §5.4 standalone-workspace fallback was NOT needed.
[profile.preload-release]
inherits = "release"
panic = "unwind"

[[bench]]
name = "meta_lv_bench"
harness = false

[[bench]]
name = "high_concurrency_bench"
harness = false

[[bench]]
name = "squeezefs_bench"
harness = false

[[bench]]
name = "ipc_hop_bench"
harness = false

# The microbench program (2026-08-04,
# .benchmarks/2026-08-04-microbench-program.md): hot-path Criterion
# groups + the baseline-comparison harness (tests/run_bench_baseline.sh).
[[bench]]
name = "copy_path_bench"
harness = false

[[bench]]
name = "zcrx_bench"
harness = false

[[bench]]
name = "read_path_bench"
harness = false

[[bench]]
name = "write_path_bench"
harness = false


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
