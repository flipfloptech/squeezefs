# SqueezeFS build system — go-task v3 (https://taskfile.dev).
#
# `task build` (the default) is the host dev build; `task build:<distro>`
# produces distro-targeted artifacts in throwaway containers. Artifacts land
# in per-target subfolders under dist/ and KEEP THEIR DEFAULT NAMES — the
# folder disambiguates, never a filename suffix: every dist/<target>/ holds
# the daemon (`squeezefs`) and the interception shim (`libsqueezefs_il.so`)
# side by side, built from the SAME commit (the KD-7 session skew gate
# refuses mixed-commit daemon/shim pairs — deploy a dist folder as a unit).
#
# Container builds mount the checkout READ-ONLY at its host path (plus the
# git common dir when the checkout is a linked worktree) so the git commit
# identity embeds — docker/build-in-container.sh asserts it per artifact,
# along with the per-distro glibc ceiling. Per-target named volumes carry
# the cargo registry and target dir for incremental rebuilds.
#
# Bootstrap go-task without root: see README.md §Building (installs into
# ./bin, never sudo system-wide). Some distros ship the binary as
# `go-task`; both spellings run this file identically.
version: '3'

vars:
  # Container runtime: CONTAINER_TOOL env overrides; else prefer docker,
  # then podman. Empty means "no runtime" — distro builds refuse loudly.
  CONTAINER_TOOL:
    sh: |
      if [ -n "${CONTAINER_TOOL:-}" ]; then
        echo "$CONTAINER_TOOL"
      elif command -v docker >/dev/null 2>&1; then
        echo docker
      elif command -v podman >/dev/null 2>&1; then
        echo podman
      fi

tasks:
  default:
    desc: Host dev build (alias for build)
    cmds:
      - task: build

  build:
    desc: 'Host dev build → dist/host/{squeezefs, libsqueezefs_il.so}'
    cmds:
      # `--locked` matches the container path (docker/build-in-container.sh):
      # a host dev build must not silently re-resolve Cargo.lock, or the
      # audited dependency set (rc-manifest §5) stops being the built one.
      - cargo build --release --locked
      # The only sanctioned shim build (§5.4 Issue-4: the root release
      # profile's panic="abort" is refused by the shim's compile guard).
      - cargo build -p squeezefs-preload --profile preload-release --features interposers --locked
      - mkdir -p dist/host
      - install -m 0755 target/release/squeezefs dist/host/squeezefs
      - install -m 0755 target/preload-release/libsqueezefs_il.so dist/host/libsqueezefs_il.so
      # Identity check only — the host dev build has no foreign glibc ceiling.
      - docker/check-artifacts.sh dist/host none

  build:rocky8:
    desc: 'Rocky Linux 8 (latest 8.x) build → dist/rocky8/ (glibc ≤ 2.28)'
    cmds:
      - task: build:distro
        vars: { TARGET: rocky8, GLIBC_CEILING: '2.28' }

  build:rocky9:
    desc: 'Rocky Linux 9 (latest 9.x) build → dist/rocky9/ (glibc ≤ 2.34)'
    cmds:
      - task: build:distro
        vars: { TARGET: rocky9, GLIBC_CEILING: '2.34' }

  build:ubuntu2404:
    desc: 'Ubuntu 24.04 build → dist/ubuntu2404/ (glibc ≤ 2.39)'
    cmds:
      - task: build:distro
        vars: { TARGET: ubuntu2404, GLIBC_CEILING: '2.39' }

  build:ubuntu2604:
    desc: 'Ubuntu 26.04 build → dist/ubuntu2604/ (glibc ceiling probed in-container)'
    cmds:
      - task: build:distro
        # "auto" = the image's own glibc, probed in-container — deliberate
        # for a young release rather than hardcoding a guess.
        vars: { TARGET: ubuntu2604, GLIBC_CEILING: 'auto' }

  build:all:
    desc: All four distro targets (serial — per-target caches, readable logs)
    cmds:
      - task: build:rocky8
      - task: build:rocky9
      - task: build:ubuntu2404
      - task: build:ubuntu2604

  # The two-profile LTO law (2026-09-02): everything above builds the
  # `release` profile (thin LTO — the dev / field-A/B / gate build).
  # `dist:*` builds the `dist` + `preload-dist` pair (fat LTO, one codegen
  # unit) and is the ONLY path a tagged release ships from; `--version`
  # names the profile so the two can never be confused in a row.
  dist:rocky8:
    desc: 'TAGGED-RELEASE build (fat LTO) for Rocky 8 → dist/rocky8-dist/'
    cmds:
      - task: dist:distro
        vars: { TARGET: rocky8, GLIBC_CEILING: '2.28' }
  dist:rocky9:
    desc: 'TAGGED-RELEASE build (fat LTO) for Rocky 9 → dist/rocky9-dist/'
    cmds:
      - task: dist:distro
        vars: { TARGET: rocky9, GLIBC_CEILING: '2.34' }
  dist:ubuntu2404:
    desc: 'TAGGED-RELEASE build (fat LTO) for Ubuntu 24.04 → dist/ubuntu2404-dist/'
    cmds:
      - task: dist:distro
        vars: { TARGET: ubuntu2404, GLIBC_CEILING: '2.39' }
  dist:ubuntu2604:
    desc: 'TAGGED-RELEASE build (fat LTO) for Ubuntu 26.04 → dist/ubuntu2604-dist/'
    cmds:
      - task: dist:distro
        vars: { TARGET: ubuntu2604, GLIBC_CEILING: 'auto' }
  dist:all:
    desc: All four TAGGED-RELEASE (fat LTO) distro targets
    cmds:
      - task: dist:rocky8
      - task: dist:rocky9
      - task: dist:ubuntu2404
      - task: dist:ubuntu2604

  dist:distro:
    internal: true
    label: 'dist:{{.TARGET}}'
    requires:
      vars: [TARGET, GLIBC_CEILING]
    cmds:
      - task: build:distro
        vars: { TARGET: '{{.TARGET}}', GLIBC_CEILING: '{{.GLIBC_CEILING}}', SQZ_DIST: '1', OUT_SUFFIX: '-dist' }

  build:distro:
    internal: true
    label: 'build:{{.TARGET}}'
    requires:
      vars: [TARGET, GLIBC_CEILING]
    preconditions:
      - sh: 'test -n "{{.CONTAINER_TOOL}}"'
        msg: 'No container runtime found (docker or podman); install one or set CONTAINER_TOOL.'
    cmds:
      - '{{.CONTAINER_TOOL}} build -t squeezefs-build:{{.TARGET}} -f docker/Dockerfile.{{.TARGET}} docker'
      - mkdir -p dist/{{.TARGET}}{{.OUT_SUFFIX}}
      # The checkout mounts READ-ONLY at its host absolute path so build.rs
      # git identity capture works verbatim; a linked worktree additionally
      # mounts its git common dir (the `.git` file's absolute target).
      - |
        set -eu
        git_mount=""
        common=$(git rev-parse --path-format=absolute --git-common-dir)
        case "$common" in
          "{{.ROOT_DIR}}"/*) ;;
          *) git_mount="-v $common:$common:ro" ;;
        esac
        # RUSTUP_HOME rides a named volume: rust-toolchain.toml pins the
        # stable CHANNEL, so cargo's shim syncs it at run time — on the
        # image overlay that sync dies EXDEV (overlayfs cannot rename a
        # lower-layer dir). The volume seeds from the image on first use
        # and persists the synced toolchain across runs.
        {{.CONTAINER_TOOL}} run --rm \
          -v "{{.ROOT_DIR}}:{{.ROOT_DIR}}:ro" \
          $git_mount \
          -v "{{.ROOT_DIR}}/dist/{{.TARGET}}{{.OUT_SUFFIX}}:/out" \
          -v "squeezefs-cargo-registry-{{.TARGET}}:/usr/local/cargo/registry" \
          -v "squeezefs-rustup-{{.TARGET}}:/usr/local/rustup" \
          -v "squeezefs-target-{{.TARGET}}:/build" \
          -w "{{.ROOT_DIR}}" \
          -e GLIBC_CEILING="{{.GLIBC_CEILING}}" \
          -e SQZ_DIST="{{.SQZ_DIST}}" \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          squeezefs-build:{{.TARGET}} \
          "{{.ROOT_DIR}}/docker/build-in-container.sh"

  check:
    desc: The authoritative full cargo gate (AGENTS.md — code-class changes)
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings
      # ENG-8: the SHIPPED configuration. `--all-features` above compiles
      # `gds`/`dhat-on`/`coz-on` and therefore NEVER compiles the default
      # cfg the release binary is built from — 3 optional features' worth of
      # `#[cfg]` divergence went unlinted until this line existed.
      - cargo clippy --all-targets -- -D warnings
      - cargo fmt --check
      - cargo test --all-features -- --test-threads=1
      - cargo doc --no-deps
      # Criterion smoke — one iteration per bench, no measurement.
      - cargo bench --benches -- --test
      # ENG-17: the first-party fuse3 fork is workspace.exclude'd, so every
      # line above compiles it only as a DEPENDENCY (default features, no
      # test/bench targets). Its own suite and its `file-lock` cfg sites
      # need their own leg.
      - task: check:fuse3
      # The isolated loom crate #[path]-includes protocol cores from src/;
      # it is outside the workspace, so no line above compiles it. Build
      # only (seconds) — the model RUN is tests/run_loom.sh.
      - task: check:loom
      - task: check:docs
      # ENG-2: supply chain. Last so a dependency advisory does not mask a
      # code failure, but inside the same gate — the AGENTS.md Phase-5
      # "no known vulnerabilities" claim had no enforcement point before.
      - task: audit

  check:docs:
    desc: >-
      The docs-class gate (AGENTS.md verification table): markdown
      link/anchor check, no cargo. Seconds, offline — the whole gate for a
      docs-only commit, and a cheap leg of the code-class gate.
    cmds:
      - tests/check_markdown_links.sh

  check:fuse3:
    desc: 'ENG-17: the excluded fuse3 fork''s own gate (its workspace, its lock)'
    dir: crates/fuse3
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo fmt --check
      - cargo test --all-features -- --test-threads=1
      - cargo bench --benches -- --test

  check:loom:
    desc: >-
      The isolated loom model-checking crate COMPILES against the cores it
      #[path]-includes from src/ (build + fmt, seconds — the same RUSTFLAGS
      and target dir as tests/run_loom.sh, so the runner reuses the
      dependency artifacts this leg built).
      loom-models/ is excluded from the workspace on purpose (a global
      `--cfg loom` poisons the main crate's deps), which also meant no gate
      line compiled it: the finding-31 core change (2026-08-28) broke every
      model silently until 2026-09-03. `-D warnings` because a dead or
      un-cfg-gated model is drift too. The model RUN stays the nightly /
      lock-free-core-change tier (AGENTS.md Phase 4): tests/run_loom.sh.
    dir: loom-models
    env:
      RUSTFLAGS: --cfg loom -D warnings
    cmds:
      - cargo build --release --tests
      - cargo fmt --check

  audit:
    desc: >-
      ENG-2: cargo-audit over BOTH lockfiles (the root workspace and the
      excluded fuse3 fork). Vulnerabilities always fail; `unsound` and
      `yanked` fail too (both are real supply-chain risk). `unmaintained`
      stays a warning — the current two (bincode, number_prefix) are
      adjudicated in docs/rc-manifest.md §5, and neither has a drop-in
      replacement inside the RC scope (bincode is an on-disk/wire codec).
    cmds:
      - cargo audit --deny unsound --deny yanked
      - cargo audit --deny unsound --deny yanked --file crates/fuse3/Cargo.lock

  check:require-mount:
    desc: >-
      Release-gate leg (spec §11 TEST-2): the twelve live-mount suites with
      SQUEEZEFS_TEST_REQUIRE_MOUNT=1, so a missing /dev/fuse /
      fuse.enable_uring / fusermount3 is a FAILURE instead of a phantom-green
      skip. Emits target/skip-ledger.jsonl.
    cmds:
      - tests/run_require_mount_gate.sh

  clean:
    desc: Remove dist/ (container caches survive; prune the named volumes to drop them)
    cmds:
      - rm -rf dist
